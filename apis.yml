aid: projectdiscovery
name: ProjectDiscovery
description: >-
  ProjectDiscovery builds the open-source security toolchain trusted across offensive security
  and attack-surface management -- Nuclei, Subfinder, httpx, Katana, Naabu, dnsx and more -- and the
  ProjectDiscovery Cloud Platform (PDCP) that operationalizes them for continuous exposure management.
  Its REST API at api.projectdiscovery.io exposes asset discovery and enumeration, template-driven
  vulnerability scanning, credential-leak monitoring, scan scheduling, configuration, and template
  management, authenticated with a single X-API-Key header over HTTPS. Founded by the creators of
  Nuclei and backed by Accel, ProjectDiscovery serves security teams automating attack-surface
  discovery and vulnerability detection at scale.
